<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#065f46"/>
  <!-- Goat emoji-style, simplified vector -->
  <!-- Body -->
  <ellipse cx="32" cy="42" rx="14" ry="10" fill="#d1fae5"/>
  <!-- Head -->
  <ellipse cx="32" cy="26" rx="9" ry="8" fill="#d1fae5"/>
  <!-- Ears -->
  <ellipse cx="22" cy="24" rx="4" ry="2.5" fill="#6ee7b7" transform="rotate(-20 22 24)"/>
  <ellipse cx="42" cy="24" rx="4" ry="2.5" fill="#6ee7b7" transform="rotate(20 42 24)"/>
  <!-- Horns -->
  <path d="M26 20 Q22 13 19 16" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M38 20 Q42 13 45 16" stroke="#a7f3d0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="28.5" cy="25" rx="1.8" ry="1.5" fill="#065f46"/>
  <ellipse cx="35.5" cy="25" rx="1.8" ry="1.5" fill="#065f46"/>
  <!-- Nose -->
  <ellipse cx="32" cy="30" rx="3.5" ry="2" fill="#6ee7b7"/>
  <!-- Nostrils -->
  <circle cx="30.5" cy="30" r="0.8" fill="#065f46"/>
  <circle cx="33.5" cy="30" r="0.8" fill="#065f46"/>
  <!-- Legs -->
  <rect x="22" y="50" width="4" height="8" rx="2" fill="#a7f3d0"/>
  <rect x="29" y="50" width="4" height="8" rx="2" fill="#a7f3d0"/>
  <rect x="36" y="50" width="4" height="8" rx="2" fill="#a7f3d0"/>
</svg>
